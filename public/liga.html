</head>
<body data-pagina="liga">
    <header class="encabezado-sitio sticky-top">

        <a class="navbar-brand" href="index.html" aria-label="orsai, inicio">
          <span class="marca-icono" aria-hidden="true">O</span>orsai.
        </a>
        <input class="menu-movil-control" type="checkbox" id="menuMovilInicio" aria-label="Mostrar menú de navegación" />
        <label class="navbar-toggler" for="menuMovilInicio">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Menú</span>
        </label>
        <div class="navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html">Resultados</a></li>
            <li class="nav-item"><a class="nav-link" href="ligas.html">Ligas</a></li>

            <div class="auth-anonymous" data-auth-anonymous>
              <button class="btn btn-sm boton-contorno-grada px-3" type="button" data-auth-open="login">Iniciar sesión</button>
              <button class="btn btn-sm boton-grada px-3" type="button" data-auth-open="register">Registrarse</button>
            </div>
            <div class="auth-session" data-auth-session hidden>
              <span class="auth-user-label">Usuario: <strong data-auth-name></strong></span>
              <button class="btn btn-sm boton-contorno-grada px-3" type="button" data-auth-logout>Cerrar sesión</button>
            </div>
            <span class="auth-feedback" data-auth-feedback role="status" aria-live="polite"></span>
          </div>
        </div>
      </nav>
