<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Consulta los equipos de las ligas disponibles en Orsai."
    />
    <title>Equipos · Orsai.</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="encabezado-sitio sticky-top">
      <nav
        class="navbar container envoltura-pagina"
        aria-label="Navegación principal"
      >
        <a class="navbar-brand" href="index.html" aria-label="Orsai, inicio">
          <span class="marca-icono" aria-hidden="true">O</span>Orsai.
        </a>
        <input
          class="menu-movil-control"
          type="checkbox"
          id="menuMovilEquipos"
          aria-label="Mostrar menú de navegación"
        />
        <label class="navbar-toggler" for="menuMovilEquipos">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Menú</span>
        </label>
        <div class="navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="equipos.html"
                >Equipos</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="ligas.html">Ligas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tienda.html">Tienda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="foro.html">Foro</a>
            </li>
          </ul>
          <div class="auth-controls">
            <div class="auth-anonymous" data-auth-anonymous>
              <button
                class="btn btn-sm boton-contorno-grada px-3"
                type="button"
                data-auth-open="login"
              >
                Iniciar sesión
              </button>
              <button
                class="btn btn-sm boton-grada px-3"
                type="button"
                data-auth-open="register"
              >
                Registrarse
              </button>
            </div>
            <div class="auth-session" data-auth-session hidden>
              <span class="auth-user-label"
                >Usuario: <strong data-auth-name></strong
              ></span>
              <button
                class="btn btn-sm boton-contorno-grada px-3"
                type="button"
                data-auth-logout
              >
                Cerrar sesión
              </button>
            </div>
            <span
              class="auth-feedback"
              data-auth-feedback
              role="status"
              aria-live="polite"
            ></span>
          </div>
        </div>
      </nav>
    </header>

    <main class="container envoltura-pagina py-4 py-lg-5">
      <nav class="migas-pan mb-3" aria-label="Ruta de navegación">
        <a href="index.html">Inicio</a><span aria-hidden="true"> / </span
        ><span aria-current="page">Equipos</span>
      </nav>

      <section class="encabezado-equipos mb-4" aria-labelledby="titulo-equipos">
        <div>
          <p class="texto-antetitulo mb-1">Las camisetas, las historias</p>
          <h1 id="titulo-equipos" class="titulo-pagina mb-1">Equipos</h1>
          <p class="atenuado mb-0">
            Explora los equipos de las ligas disponibles.
          </p>
        </div>
      </section>

      <section aria-label="Listado de equipos">
        <div id="contenedorEquipos" class="cuadricula-equipos" aria-live="polite">
          <p id="estadoEquipos" class="estado-equipos">
            Los equipos se mostrarán aquí cuando estén disponibles.
          </p>
        </div>
        <template id="plantillaTarjetaEquipo">
          <a class="tarjeta-equipo" href="equipo.html?id=">
            <img class="escudo-equipo" alt="" loading="lazy" />
            <span class="datos-tarjeta-equipo">
              <strong class="nombre-tarjeta-equipo"></strong>
              <span class="liga-tarjeta-equipo"></span>
            </span>
            <span class="flecha-tarjeta-equipo" aria-hidden="true">→</span>
          </a>
        </template>
      </section>
    </main>

    <footer class="pie-sitio py-4">
      <div
        class="container envoltura-pagina d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3"
      >
        <a class="navbar-brand fs-5" href="index.html">Orsai.</a>
        <span>© <span id="anioActual">2026</span> Orsai</span>
      </div>
    </footer>
    <script type="module" src="js/main.js" defer></script>
  </body>
</html>
