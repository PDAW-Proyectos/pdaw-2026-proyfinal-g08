<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Información y detalles de un equipo de fútbol en Orsai."
    />
    <title>Equipo · Orsai.</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="encabezado-sitio sticky-top">
      <nav
        class="navbar container envoltura-pagina"
        aria-label="Navegación principal"
      >
        <a class="navbar-brand" href="index.html" aria-label="Orsai, inicio">
          <span class="marca-icono" aria-hidden="true">O</span>Orsai.
        </a>
        <input
          class="menu-movil-control"
          type="checkbox"
          id="menuMovilEquipo"
          aria-label="Mostrar menú de navegación"
        />
        <label class="navbar-toggler" for="menuMovilEquipo">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Menú</span>
        </label>
        <div class="navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="equipos.html">Equipos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="ligas.html">Ligas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tienda.html">Tienda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="foro.html">Foro</a>
            </li>
          </ul>
          <div class="auth-controls">
            <div class="auth-anonymous" data-auth-anonymous>
              <button
                class="btn btn-sm boton-contorno-grada px-3"
                type="button"
                data-auth-open="login"
              >
                Iniciar sesión
              </button>
              <button
                class="btn btn-sm boton-grada px-3"
                type="button"
                data-auth-open="register"
              >
                Registrarse
              </button>
            </div>
            <div class="auth-session" data-auth-session hidden>
              <span class="auth-user-label"
                >Usuario: <strong data-auth-name></strong
              ></span>
              <button
                class="btn btn-sm boton-contorno-grada px-3"
                type="button"
                data-auth-logout
              >
                Cerrar sesión
              </button>
            </div>
            <span
              class="auth-feedback"
              data-auth-feedback
              role="status"
              aria-live="polite"
            ></span>
          </div>
        </div>
      </nav>
    </header>

    <main class="container envoltura-pagina py-4 py-lg-5">
      <nav class="migas-pan mb-3" aria-label="Ruta de navegación">
        <a href="index.html">Inicio</a><span aria-hidden="true"> / </span
        ><a href="equipos.html">Equipos</a
        ><span aria-hidden="true"> / </span>
        <span aria-current="page">Detalle</span>
      </nav>

      <section
        class="panel-detalle-equipo"
        aria-labelledby="nombreEquipo"
        data-equipo-id
      >
        <div class="insignia-detalle-equipo" aria-hidden="true">
          <img id="escudoEquipo" alt="" />
        </div>
        <div class="informacion-detalle-equipo">
          <p id="ligaEquipo" class="texto-antetitulo mb-1"></p>
          <h1 id="nombreEquipo" class="titulo-pagina mb-2">
            Detalle del equipo
          </h1>
          <p id="paisEquipo" class="atenuado mb-0"></p>
        </div>
      </section>

      <section class="panel contenido-detalle-equipo mt-4">
        <h2 class="titulo-seccion">Información del equipo</h2>
        <p id="descripcionEquipo" class="atenuado mb-0">
          Los detalles del equipo estarán disponibles cuando recibamos sus datos.
        </p>
      </section>
      <a class="btn boton-contorno-grada mt-4" href="equipos.html">
        <span aria-hidden="true">←</span> Volver a equipos
      </a>
    </main>

    <footer class="pie-sitio py-4">
      <div
        class="container envoltura-pagina d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3"
      >
        <a class="navbar-brand fs-5" href="index.html">Orsai.</a>
        <span>© <span id="anioActual">2026</span> Orsai</span>
      </div>
    </footer>
    <script type="module" src="js/main.js" defer></script>
  </body>
</html>
